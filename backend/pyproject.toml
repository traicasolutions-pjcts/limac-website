[project]
name = "limac-warranty-api"
version = "0.1.0"
description = "FastAPI warranty registration backend for Limac Power Tech"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=25.1.0",
  "cloudinary>=1.44.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "motor>=3.7.0",
  "openpyxl>=3.1.5",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pymongo>=4.13.0",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.20",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
